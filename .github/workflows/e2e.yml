name: E2E (клики в браузере, CSP и гидратация)

# Срочный фикс (сентябрь 2026): строгая CSP без нонса блокировала встроенные скрипты гидратации
# Next.js — сайт открывался, но ни одна кнопка не работала (ответ на вопрос теста, вход, checkout).
# Отсутствие такой проверки и позволило багу пройти этап 10 незамеченным (docker-smoke.yml проверяет
# только код ответа главной страницы, без единого клика в браузере).
#
# Здесь — собранный сайт (`next build` + `.next/standalone`, как в Dockerfile) и PostgreSQL,
# настоящий браузер (Playwright/Chromium) и те же клики, что при ручной проверке: главная → старт →
# три ответа теста; регистрация и вход; тизер → чекаут в тестовом режиме → /admin. Падение при любой
# ошибке Content-Security-Policy или гидратации в консоли браузера роняет джобу.
#
# Этап B2 (сентябрь 2026, e2e/b2-funnel.spec.ts) добавил отдельный прогон полного пути: тизер →
# checkout (выбор пакета, язык отчёта, «без цели» + «Маршрут» → выбор цели, UX-18) → тестовая
# оплата → генерация → отчёт → PDF (настоящий клик и скачивание) → кабинет — на русском и
# узбекском и на четырёх ширинах экрана (360/390/768/1440 px), плюс проверка на отсутствие
# горизонтального скролла на каждом шаге.

on:
  pull_request:
  push:
    branches: [main]

jobs:
  e2e:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: yourway
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/yourway
      DATABASE_URL_UNPOOLED: postgresql://postgres:postgres@localhost:5432/yourway
      DEFAULT_LOCALE: uz
      APP_URL: http://localhost:3000
      AI_MODE: mock
      # Тестовая оплата и служебные /dev/* страницы (используются в e2e/csp-hydration.spec.ts)
      # включаются вне боевого сайта. VERCEL_ENV=preview — тот же переключатель, что и на
      # превью-ссылках Vercel (см. src/lib/dev.ts, src/lib/payments/config.ts). NODE_ENV=production
      # здесь, на уровне джобы, НЕ задаём: `npm ci` в этом случае ставит только "dependencies" и
      # пропускает devDependencies (dotenv, prisma, playwright и т. д.) — именно так уронилась первая
      # попытка этой джобы (`prisma generate` падал с «Cannot find module 'dotenv/config'»). Как в
      # Dockerfile, NODE_ENV=production выставляется только на запуск уже собранного сервера — см. шаг
      # «Запустить собранный сайт в фоне» ниже.
      VERCEL_ENV: preview
      PAYMENTS_TEST_MODE: "true"
      # e2ecompare — отдельный суперадмин для e2e/admin-compare.spec.ts (слепое сравнение моделей),
      # e2ehome — для e2e/home.spec.ts (таблица «Интерес к направлениям» в /admin/analytics),
      # e2eshare — для e2e/share.spec.ts (строки «Поделились» и «Сохранили картинку» там же).
      SUPERADMIN_LOGINS: e2eadmin,e2ecompare,e2ehome,e2eshare
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"
          cache: "npm"

      - name: Установить зависимости
        run: npm ci

      - name: Применить миграции Prisma
        run: npx prisma migrate deploy

      - name: Собрать сайт (production build)
        run: |
          mkdir -p public
          npm run build

      - name: Собрать standalone-папку для запуска (как в Dockerfile)
        run: |
          cp -r public .next/standalone/public
          cp -r .next/static .next/standalone/.next/static

      - name: Установить браузер для Playwright
        run: npx playwright install --with-deps chromium

      - name: Запустить собранный сайт в фоне
        working-directory: .next/standalone
        env:
          NODE_ENV: production
        run: nohup node server.js > /tmp/next-server.log 2>&1 &

      - name: Подождать, пока сайт станет доступен
        run: |
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:3000/api/health; then
              echo "сайт ответил"
              exit 0
            fi
            echo "попытка $i: сайт ещё не готов, ждём…"
            sleep 2
          done
          echo "сайт не поднялся за отведённое время" >&2
          cat /tmp/next-server.log >&2 || true
          exit 1

      - name: Клики в браузере (Playwright)
        run: npm run test:e2e

      - name: Логи сайта при сбое
        if: failure()
        run: cat /tmp/next-server.log || true

      - name: Отчёт Playwright при сбое
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
